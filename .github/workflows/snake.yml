name: Generate Pac-Man Contribution

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate pac-man SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const fs = require("fs");

          const result = execSync(`gh api graphql -f query='
            { user(login: "yasserhll") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date contributionCount color
                      }
                    }
                  }
                }
            } }'`).toString();

          const data = JSON.parse(result);
          const cal = data.data.user.contributionsCollection.contributionCalendar;
          const weeks = cal.weeks;

          const grid = weeks.map(w => w.contributionDays);
          const W = grid.length;
          const H = 7;
          const CW = 13, CH = 13, GAP = 2;
          const svgW = W * (CW + GAP) + 40;
          const svgH = H * (CH + GAP) + 60;

          const COLORS = {
            dark:  { bg: "#0d1117", empty: "#161b22", dot: "#ffffff" },
            light: { bg: "#ffffff", empty: "#ebedf0", dot: "#24292f" },
          };

          function pacPath(mouthAngle) {
            const r = 7;
            if (mouthAngle < 0.01) {
              return `M0,0 L${r},0 A${r},${r} 0 1,0 ${r},0.001 Z`;
            }
            const cx = Math.cos(mouthAngle) * r;
            const sy = Math.sin(mouthAngle) * r;
            return `M0,0 L${cx.toFixed(2)},${(-sy).toFixed(2)} A${r},${r} 0 1,0 ${cx.toFixed(2)},${sy.toFixed(2)} Z`;
          }

          const openPath  = pacPath(0.40);
          const closedPath = pacPath(0.02);

          function buildSVG(theme) {
            const C = COLORS[theme];
            const cells = [];
            const dots  = [];

            for (let w = 0; w < W; w++) {
              for (let d = 0; d < H; d++) {
                const day = grid[w] && grid[w][d];
                if (!day) continue;
                const x = w * (CW + GAP) + 20;
                const y = d * (CH + GAP) + 30;
                const fill = day.contributionCount > 0 ? day.color : C.empty;
                cells.push(`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${fill}"/>`);
                if (day.contributionCount > 0) {
                  dots.push({ x: x + CW / 2, y: y + CH / 2 });
                }
              }
            }

            const sorted = dots.sort((a, b) => a.x - b.x || a.y - b.y);

            if (sorted.length === 0) {
              return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="${C.bg}"/>
                ${cells.join('\n')}
              </svg>`;
            }

            const totalFrames = sorted.length + 20;
            const dur = `${(totalFrames * 0.1).toFixed(1)}s`;

            const startX = sorted[0].x - 20;
            const startY = sorted[0].y;
            const endX   = sorted[sorted.length - 1].x + 30;
            const endY   = sorted[sorted.length - 1].y;

            const translateValues = [
              `${startX},${startY}`,
              ...sorted.map(d => `${d.x},${d.y}`),
              `${endX},${endY}`
            ].join(';');

            const translateKeyTimes = [
              '0',
              ...sorted.map((_, i) => ((i + 10) / totalFrames).toFixed(3)),
              '1'
            ].join(';');

            const dotElems = sorted.map((d, i) => {
              const t  = ((i + 10) / totalFrames).toFixed(3);
              const t2 = Math.min((i + 12) / totalFrames, 0.999).toFixed(3);
              return `<circle cx="${d.x}" cy="${d.y}" r="2.5" fill="${C.dot}">
                <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;${t};${t2};1" dur="${dur}" repeatCount="indefinite"/>
              </circle>`;
            }).join('\n');

            const pacman = `<path fill="#FFD700">
              <animateTransform attributeName="transform" type="translate"
                values="${translateValues}"
                keyTimes="${translateKeyTimes}"
                dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <animate attributeName="d"
                values="${openPath};${closedPath};${openPath}"
                dur="0.35s" repeatCount="indefinite"/>
            </path>`;

            return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="${C.bg}"/>
              ${cells.join('\n')}
              ${dotElems}
              ${pacman}
            </svg>`;
          }

          fs.mkdirSync("dist", { recursive: true });
          fs.writeFileSync("dist/pacman-contribution-graph.svg", buildSVG("light"));
          fs.writeFileSync("dist/pacman-contribution-graph-dark.svg", buildSVG("dark"));
          console.log(`Pac-Man generated — ${cal.totalContributions} contributions`);
          EOF

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
