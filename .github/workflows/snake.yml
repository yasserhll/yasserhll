name: Generate Pac-Man Contribution

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate pac-man SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const fs = require("fs");

          const result = execSync(`gh api graphql -f query='
            { user(login: "yasserhll") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date contributionCount color
                      }
                    }
                  }
                }
            } }'`).toString();

          const data = JSON.parse(result);
          const cal = data.data.user.contributionsCollection.contributionCalendar;

          const weeks = cal.weeks.slice(-26);
          const W = weeks.length;
          const H = 7;
          const CW = 13, CH = 13, GAP = 2;
          const svgW = W * (CW + GAP) + 40;
          const svgH = H * (CH + GAP) + 60;
          const grid = weeks.map(w => w.contributionDays);

          const COLORS = {
            dark:  { bg: "#0d1117", empty: "#161b22", dot: "#ffffff" },
            light: { bg: "#ffffff", empty: "#ebedf0", dot: "#1a1a2e" },
          };

          const R = 8;

          function pacPath(a) {
            if (a < 0.01) return `M0,0 L${R},0 A${R},${R} 0 1,0 ${R},0.001 Z`;
            const cx = (Math.cos(a) * R).toFixed(2);
            const sy = (Math.sin(a) * R).toFixed(2);
            return `M0,0 L${cx},${-sy} A${R},${R} 0 1,0 ${cx},${sy} Z`;
          }

          function ghostPath() {
            const r = R;
            return `M${-r},0 A${r},${r} 0 0,1 ${r},0 L${r},${r} ` +
              `L${(r*0.6).toFixed(1)},${(r*0.65).toFixed(1)} ` +
              `L${(r*0.2).toFixed(1)},${r} ` +
              `L0,${(r*0.65).toFixed(1)} ` +
              `L${(-r*0.2).toFixed(1)},${r} ` +
              `L${(-r*0.6).toFixed(1)},${(r*0.65).toFixed(1)} ` +
              `L${-r},${r} Z`;
          }

          function ghostEyes() {
            const r = R;
            const ew = 2.4, ep = 1.4;
            return `<circle cx="${(-r*0.38).toFixed(1)}" cy="${(-r*0.15).toFixed(1)}" r="${ew}" fill="white"/>` +
              `<circle cx="${(r*0.38).toFixed(1)}" cy="${(-r*0.15).toFixed(1)}" r="${ew}" fill="white"/>` +
              `<circle cx="${(-r*0.25).toFixed(1)}" cy="${(-r*0.1).toFixed(1)}" r="${ep}" fill="#1a1aff"/>` +
              `<circle cx="${(r*0.5).toFixed(1)}" cy="${(-r*0.1).toFixed(1)}" r="${ep}" fill="#1a1aff"/>`;
          }

          const GHOST_PATH = ghostPath();
          const GHOST_EYES = ghostEyes();
          const PAC_OPEN   = pacPath(0.40);
          const PAC_CLOSED = pacPath(0.02);

          function buildSVG(theme) {
            const C = COLORS[theme];
            const cells = [];
            const dots  = [];

            for (let w = 0; w < W; w++) {
              for (let d = 0; d < H; d++) {
                const day = grid[w] && grid[w][d];
                if (!day) continue;
                const x = w * (CW + GAP) + 20;
                const y = d * (CH + GAP) + 30;
                const fill = day.contributionCount > 0 ? day.color : C.empty;
                cells.push(`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${fill}"/>`);
                if (day.contributionCount > 0) dots.push({ x: x + CW / 2, y: y + CH / 2 });
              }
            }

            const sorted = dots.sort((a, b) => a.x - b.x || a.y - b.y);

            if (sorted.length === 0) {
              return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="${C.bg}"/>
                ${cells.join('\n')}
              </svg>`;
            }

            const N = sorted.length;
            const totalFrames = N + 20;
            const dur = `${(totalFrames * 0.09).toFixed(1)}s`;

            const startX = sorted[0].x - 20;
            const startY = sorted[0].y;
            const endX   = sorted[N - 1].x + 30;
            const endY   = sorted[N - 1].y;

            const allPos = [{ x: startX, y: startY }, ...sorted, { x: endX, y: endY }];
            const ktArr  = [0, ...sorted.map((_, i) => (i + 10) / totalFrames), 1];
            const kTimes = ktArr.map(t => t.toFixed(3)).join(';');

            const tvMain = allPos.map(p => `${p.x},${p.y}`).join(';');

            function offsetTV(off) {
              return allPos.map((_, idx) => {
                const src = allPos[Math.max(0, idx - off)];
                return `${src.x},${src.y}`;
              }).join(';');
            }

            const dotElems = sorted.map((d, i) => {
              const t  = ((i + 10) / totalFrames).toFixed(3);
              const t2 = Math.min((i + 12) / totalFrames, 0.999).toFixed(3);
              return `<circle cx="${d.x}" cy="${d.y}" r="2.5" fill="${C.dot}">
                <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;${t};${t2};1" dur="${dur}" repeatCount="indefinite"/>
              </circle>`;
            }).join('\n');

            const ghost2 = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${offsetTV(16)}" keyTimes="${kTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path d="${GHOST_PATH}" fill="#FFB8FF"/>
              ${GHOST_EYES}
            </g>`;

            const ghost1 = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${offsetTV(9)}" keyTimes="${kTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path d="${GHOST_PATH}" fill="#FF0000"/>
              ${GHOST_EYES}
            </g>`;

            const pacman = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${tvMain}" keyTimes="${kTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path fill="#FFD700">
                <animate attributeName="d" values="${PAC_OPEN};${PAC_CLOSED};${PAC_OPEN}" dur="0.35s" repeatCount="indefinite"/>
              </path>
            </g>`;

            return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="${C.bg}"/>
              ${cells.join('\n')}
              ${dotElems}
              ${ghost2}
              ${ghost1}
              ${pacman}
            </svg>`;
          }

          fs.mkdirSync("dist", { recursive: true });
          fs.writeFileSync("dist/pacman-contribution-graph.svg", buildSVG("light"));
          fs.writeFileSync("dist/pacman-contribution-graph-dark.svg", buildSVG("dark"));
          console.log(`Pac-Man generated — ${cal.totalContributions} contributions`);
          EOF

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
