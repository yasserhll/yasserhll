name: Generate Pac-Man Contribution

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate pac-man SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const fs = require("fs");

          const result = execSync(`gh api graphql -f query='
            { user(login: "yasserhll") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date contributionCount color
                      }
                    }
                  }
                }
            } }'`).toString();

          const data = JSON.parse(result);
          const cal = data.data.user.contributionsCollection.contributionCalendar;
          const weeks = cal.weeks;

          // Build grid: [week][day] = { count, color }
          const grid = weeks.map(w => w.contributionDays);
          const W = grid.length;   // number of weeks
          const H = 7;             // days per week

          const CW = 13, CH = 13, GAP = 2;
          const COLS = W;
          const svgW = COLS * (CW + GAP) + 40;
          const svgH = H * (CH + GAP) + 60;
          const COLORS = {
            dark:  { bg: "#0d1117", empty: "#161b22", text: "#c9d1d9" },
            light: { bg: "#ffffff", empty: "#ebedf0", text: "#24292f" },
          };

          function buildSVG(theme) {
            const C = COLORS[theme];
            const cells = [];
            const dots = [];   // food positions for pac-man to eat

            for (let w = 0; w < W; w++) {
              for (let d = 0; d < H; d++) {
                const day = grid[w] && grid[w][d];
                if (!day) continue;
                const x = w * (CW + GAP) + 20;
                const y = d * (CH + GAP) + 30;
                const fill = day.contributionCount > 0 ? day.color : C.empty;
                cells.push(`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${fill}"/>`);
                if (day.contributionCount > 0) {
                  dots.push({ x: x + CW / 2, y: y + CH / 2 });
                }
              }
            }

            // Pac-man path: follow dots left-to-right, top-to-bottom
            const sorted = dots.sort((a, b) => a.x - b.x || a.y - b.y);
            const totalFrames = sorted.length + 20;
            const dur = `${(totalFrames * 0.12).toFixed(1)}s`;

            // Pac-man body animation keyframes
            let pxFrames = "", pyFrames = "";
            const step = 1 / totalFrames;
            for (let i = 0; i < sorted.length; i++) {
              const t = ((i + 10) * step * 100).toFixed(1);
              pxFrames += `${t}%{cx:${sorted[i].x}px}`;
              pyFrames += `${t}%{cy:${sorted[i].y}px}`;
            }

            const startX = sorted[0]?.x ?? 20;
            const startY = sorted[0]?.y ?? 30;

            // Dot hide animations
            const dotAnims = sorted.map((d, i) => {
              const t = ((i + 10) * step * 100).toFixed(1);
              const id = `d${i}`;
              return `
                <circle id="${id}" cx="${d.x}" cy="${d.y}" r="2" fill="${C.text}" opacity="1">
                  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;${(parseFloat(t) / 100).toFixed(3)};${Math.min(parseFloat(t) / 100 + 0.01, 1).toFixed(3)};1" dur="${dur}" repeatCount="indefinite"/>
                </circle>`;
            }).join("");

            const pacman = sorted.length > 0 ? `
              <g>
                <circle r="7" fill="#FFD700">
                  <animate attributeName="cx" values="${startX};${sorted.map(d => d.x).join(";")}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
                  <animate attributeName="cy" values="${startY};${sorted.map(d => d.y).join(";")}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
                </circle>
              </g>` : "";

            return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="${C.bg}"/>
              ${cells.join("\n")}
              ${dotAnims}
              ${pacman}
            </svg>`;
          }

          fs.mkdirSync("dist", { recursive: true });
          fs.writeFileSync("dist/pacman-contribution-graph.svg", buildSVG("light"));
          fs.writeFileSync("dist/pacman-contribution-graph-dark.svg", buildSVG("dark"));
          console.log(`✅ Pac-Man generated — ${cal.totalContributions} contributions`);
          EOF

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
