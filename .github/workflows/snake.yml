name: Generate Pac-Man Contribution

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate pac-man SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const fs = require("fs");

          const result = execSync(`gh api graphql -f query='
            { user(login: "yasserhll") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date contributionCount color
                      }
                    }
                  }
                }
            } }'`).toString();

          const data = JSON.parse(result);
          const cal = data.data.user.contributionsCollection.contributionCalendar;

          // Last 26 weeks for readability
          const weeks = cal.weeks.slice(-26);
          const W = weeks.length;
          const H = 7;
          const CW = 13, CH = 13, GAP = 2;
          const STEP = CW + GAP;
          const svgW = W * STEP + 40;
          const svgH = H * STEP + 60;

          const THEMES = {
            dark:  { bg: "#0d1117", wall: "#1c2128", wallStroke: "#30363d", dot: "#ffffff" },
            light: { bg: "#f6f8fa", wall: "#ebedf0", wallStroke: "#d0d7de", dot: "#1a1a2e" },
          };

          const R = 8;

          function pacPath(a) {
            if (a < 0.01) return `M0,0 L${R},0 A${R},${R} 0 1,0 ${R},0.001 Z`;
            const cx = (Math.cos(a) * R).toFixed(2);
            const sy = (Math.sin(a) * R).toFixed(2);
            return `M0,0 L${cx},${-sy} A${R},${R} 0 1,0 ${cx},${sy} Z`;
          }

          function ghostPath() {
            const r = R;
            return `M${-r},0 A${r},${r} 0 0,1 ${r},0 L${r},${r} ` +
              `L${(r*0.6).toFixed(1)},${(r*0.65).toFixed(1)} ` +
              `L${(r*0.2).toFixed(1)},${r} ` +
              `L0,${(r*0.65).toFixed(1)} ` +
              `L${(-r*0.2).toFixed(1)},${r} ` +
              `L${(-r*0.6).toFixed(1)},${(r*0.65).toFixed(1)} ` +
              `L${-r},${r} Z`;
          }

          function ghostEyes() {
            const r = R;
            return `<circle cx="${(-r*0.38).toFixed(1)}" cy="${(-r*0.18).toFixed(1)}" r="2.5" fill="white"/>` +
              `<circle cx="${(r*0.38).toFixed(1)}" cy="${(-r*0.18).toFixed(1)}" r="2.5" fill="white"/>` +
              `<circle cx="${(-r*0.22).toFixed(1)}" cy="${(-r*0.12).toFixed(1)}" r="1.4" fill="#1a1aff"/>` +
              `<circle cx="${(r*0.52).toFixed(1)}" cy="${(-r*0.12).toFixed(1)}" r="1.4" fill="#1a1aff"/>`;
          }

          // Boustrophedon path — pac-man traverses ALL cells row by row
          function buildPath() {
            const path = [];
            for (let d = 0; d < H; d++) {
              if (d % 2 === 0) {
                for (let w = 0; w < W; w++) path.push({ w, d });
              } else {
                for (let w = W - 1; w >= 0; w--) path.push({ w, d });
              }
            }
            return path;
          }

          function cellCenter(w, d) {
            return {
              x: w * STEP + CW / 2 + 20,
              y: d * STEP + CH / 2 + 30
            };
          }

          const GHOST_PATH = ghostPath();
          const GHOST_EYES = ghostEyes();
          const PAC_OPEN   = pacPath(0.40);
          const PAC_CLOSED = pacPath(0.02);

          function buildSVG(theme) {
            const C = THEMES[theme];
            const pathOrder = buildPath();
            const N = pathOrder.length;

            // Build cell data lookup
            const cellData = {};
            weeks.forEach((week, w) => {
              (week.contributionDays || []).forEach((day, d) => {
                cellData[`${w},${d}`] = day;
              });
            });

            const cells    = [];
            const foodDots = [];

            // Draw ALL cells — contribution cells green, empty cells as maze walls
            for (let i = 0; i < N; i++) {
              const { w, d } = pathOrder[i];
              const day = cellData[`${w},${d}`];
              const x  = w * STEP + 20;
              const y  = d * STEP + 30;
              const cx = x + CW / 2;
              const cy = y + CH / 2;

              if (day && day.contributionCount > 0) {
                cells.push(`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${day.color}"/>`);
                foodDots.push({ x: cx, y: cy, pathIdx: i });
              } else {
                cells.push(`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="2" fill="${C.wall}" stroke="${C.wallStroke}" stroke-width="0.5"/>`);
              }
            }

            // Keyframe positions for full path
            const posValues = pathOrder.map(({ w, d }) => {
              const p = cellCenter(w, d);
              return `${p.x},${p.y}`;
            }).join(';');

            const keyTimes = pathOrder.map((_, i) => (i / (N - 1)).toFixed(3)).join(';');
            const dur = `${(N * 0.07).toFixed(1)}s`;

            // Ghost offset (follow behind by N steps)
            function ghostTV(offset) {
              return pathOrder.map((_, i) => {
                const src = pathOrder[Math.max(0, i - offset)];
                const p = cellCenter(src.w, src.d);
                return `${p.x},${p.y}`;
              }).join(';');
            }

            // Food dot disappear animations
            const dotElems = foodDots.map(({ x, y, pathIdx }) => {
              const t  = (pathIdx / (N - 1)).toFixed(3);
              const t2 = Math.min((pathIdx + 2) / (N - 1), 0.999).toFixed(3);
              return `<circle cx="${x}" cy="${y}" r="2.5" fill="${C.dot}">
                <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;${t};${t2};1" dur="${dur}" repeatCount="indefinite"/>
              </circle>`;
            }).join('\n');

            const ghost2 = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${ghostTV(18)}" keyTimes="${keyTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path d="${GHOST_PATH}" fill="#FFB8FF"/>
              ${GHOST_EYES}
            </g>`;

            const ghost1 = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${ghostTV(10)}" keyTimes="${keyTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path d="${GHOST_PATH}" fill="#FF0000"/>
              ${GHOST_EYES}
            </g>`;

            const pacman = `<g>
              <animateTransform attributeName="transform" type="translate"
                values="${posValues}" keyTimes="${keyTimes}" dur="${dur}" repeatCount="indefinite" calcMode="linear"/>
              <path fill="#FFD700">
                <animate attributeName="d" values="${PAC_OPEN};${PAC_CLOSED};${PAC_OPEN}" dur="0.35s" repeatCount="indefinite"/>
              </path>
            </g>`;

            return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="${C.bg}"/>
              ${cells.join('\n')}
              ${dotElems}
              ${ghost2}
              ${ghost1}
              ${pacman}
            </svg>`;
          }

          fs.mkdirSync("dist", { recursive: true });
          fs.writeFileSync("dist/pacman-contribution-graph.svg", buildSVG("light"));
          fs.writeFileSync("dist/pacman-contribution-graph-dark.svg", buildSVG("dark"));
          console.log(`Pac-Man generated — ${cal.totalContributions} total contributions`);
          EOF

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
