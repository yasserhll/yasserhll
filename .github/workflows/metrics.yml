name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/metrics/**"
  workflow_dispatch:

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node << 'EOF'
          const https = require("https");
          const fs = require("fs");
          const path = require("path");

          const TOKEN = process.env.GH_TOKEN;
          const USER = "yasserhll";

          function gql(query, variables = {}) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({ query, variables });
              const req = https.request(
                {
                  hostname: "api.github.com",
                  path: "/graphql",
                  method: "POST",
                  headers: {
                    Authorization: `bearer ${TOKEN}`,
                    "Content-Type": "application/json",
                    "User-Agent": "github-metrics-action",
                    "Content-Length": Buffer.byteLength(body),
                  },
                },
                (res) => {
                  let data = "";
                  res.on("data", (c) => (data += c));
                  res.on("end", () => resolve(JSON.parse(data)));
                }
              );
              req.on("error", reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const { data } = await gql(`
              query($login: String!) {
                user(login: $login) {
                  name
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                  }
                  pullRequests(states: MERGED) { totalCount }
                  repositories(first: 100, ownerAffiliations: OWNER, privacy: BOTH, isFork: false) {
                    nodes {
                      stargazerCount
                      languages(first: 10, orderBy: { field: SIZE, direction: DESC }) {
                        edges { size node { name color } }
                      }
                    }
                  }
                }
              }
            `, { login: USER });

            const user = data.user;
            const repos = user.repositories.nodes;

            const commits = user.contributionsCollection.totalCommitContributions;
            const prs = user.contributionsCollection.totalPullRequestContributions;
            const mergedPRs = user.pullRequests.totalCount;
            const issues = user.contributionsCollection.totalIssueContributions;
            const stars = repos.reduce((s, r) => s + r.stargazerCount, 0);

            // Language aggregation
            const langMap = {};
            for (const repo of repos) {
              for (const edge of repo.languages.edges) {
                const n = edge.node.name;
                langMap[n] = langMap[n] || { size: 0, color: edge.node.color };
                langMap[n].size += edge.size;
              }
            }
            const totalSize = Object.values(langMap).reduce((s, l) => s + l.size, 0);
            const langs = Object.entries(langMap)
              .map(([name, { size, color }]) => ({ name, size, color, pct: (size / totalSize) * 100 }))
              .sort((a, b) => b.size - a.size)
              .slice(0, 8);

            fs.mkdirSync(".github/metrics", { recursive: true });

            // ── Overview SVG ──────────────────────────────────────────
            const rows = [
              ["Commits (all time)", commits],
              ["Pull Requests", prs],
              ["PRs Merged", mergedPRs],
              ["Issues", issues],
              ["Stars Earned", stars],
            ];
            const rowsSVG = rows.map(([label, value], i) => {
              const y = 110 + i * 32;
              return `
                <rect x="20" y="${y - 10}" width="8" height="8" rx="2" fill="#FF6B35"/>
                <text x="38" y="${y}" font-size="13" fill="#c9d1d9">${label}</text>
                <text x="380" y="${y}" font-size="13" font-weight="700" fill="#FF6B35" text-anchor="end">${value.toLocaleString()}</text>`;
            }).join("");

            const overviewSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" font-family="'Segoe UI',sans-serif">
              <rect width="400" height="290" rx="12" fill="#0d1117"/>
              <rect x="1" y="1" width="398" height="288" rx="11" fill="none" stroke="#21262d" stroke-width="1.5"/>
              <text x="20" y="40" font-size="15" font-weight="700" fill="#FF6B35">${user.name || USER}'s GitHub Stats</text>
              <line x1="20" y1="55" x2="380" y2="55" stroke="#21262d" stroke-width="1"/>
              ${rowsSVG}
            </svg>`;

            fs.writeFileSync(".github/metrics/overview.svg", overviewSVG);

            // ── Languages SVG ─────────────────────────────────────────
            const barH = 8;
            let barX = 20;
            const barW = 360;
            const barSegments = langs.map((l) => {
              const w = (l.pct / 100) * barW;
              const seg = `<rect x="${barX.toFixed(1)}" y="60" width="${w.toFixed(1)}" height="${barH}" fill="${l.color || "#8b949e"}" rx="0"/>`;
              barX += w;
              return seg;
            }).join("");

            const langRows = langs.map((l, i) => {
              const col = i % 2 === 0 ? 20 : 210;
              const y = 100 + Math.floor(i / 2) * 28;
              return `
                <circle cx="${col + 6}" cy="${y - 4}" r="6" fill="${l.color || "#8b949e"}"/>
                <text x="${col + 18}" y="${y}" font-size="12" fill="#c9d1d9">${l.name}</text>
                <text x="${col + 160}" y="${y}" font-size="12" fill="#8b949e" text-anchor="end">${l.pct.toFixed(1)}%</text>`;
            }).join("");

            const svgH = 100 + Math.ceil(langs.length / 2) * 28 + 20;
            const langsSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="${svgH}" viewBox="0 0 400 ${svgH}" font-family="'Segoe UI',sans-serif">
              <rect width="400" height="${svgH}" rx="12" fill="#0d1117"/>
              <rect x="1" y="1" width="398" height="${svgH - 2}" rx="11" fill="none" stroke="#21262d" stroke-width="1.5"/>
              <text x="20" y="40" font-size="15" font-weight="700" fill="#FF6B35">Most Used Languages</text>
              <line x1="20" y1="55" x2="380" y2="55" stroke="#21262d" stroke-width="1"/>
              ${barSegments}
              ${langRows}
            </svg>`;

            fs.writeFileSync(".github/metrics/languages.svg", langsSVG);
            console.log("✅ SVGs generated: overview.svg + languages.svg");
          }

          main().catch((e) => { console.error(e); process.exit(1); });
          EOF

      - name: Commit and push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/metrics/
          git diff --cached --quiet || (git commit -m "chore: update metrics [skip ci]" && git push)
